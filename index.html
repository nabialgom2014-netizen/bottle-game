<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 Royal Bottle Challenge - التحدي الملكي</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta property="og:title" content="👑 Royal Bottle Challenge - التحدي الملكي">
<meta property="og:description" content="العب التحدي الملكي، 20 مستوى، هل تقدر تجيب القارورة في المنطقة الخضراء؟">
<meta property="og:image" content="icon.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0b2a">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#0b0b2a;color:#fff;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:10px}
h1{font-size:28px;text-align:center;margin:8px 0 2px;color:#ffd700;text-shadow:0 0 20px #ffd700}
.sub{text-align:center;color:#ccc;font-size:13px;margin-bottom:10px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.35);border-radius:18px;padding:14px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffd700;background:#111;font-size:16px;color:#fff;text-align:center;outline:none}
button{cursor:pointer;border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px}
.btn-gold{width:100%;background:linear-gradient(180deg,#ffe27a,#d4a017);color:#1a1000;margin-top:10px}
.btn-dark{background:#222;color:#fff;border:1px solid #555}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.lv{aspect-ratio:1;border-radius:12px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv small{font-size:10px}
.lv.open{background:linear-gradient(180deg,#2b8a3e,#145a25);color:#fff;border:1px solid #7dff9a}
.lv.current{background:linear-gradient(180deg,#ffd700,#b8860b);color:#000;box-shadow:0 0 18px #ffd700}
.lv.locked{background:#2a2a3a;color:#888;border:1px solid #444}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:99;padding:20px}
#msgBox{background:#1a1a35;border:2px solid #ffd700;border-radius:18px;padding:20px;text-align:center;max-width:340px;width:100%}
#game{display:none;flex-direction:column;flex:1}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between}
#canvasWrap{flex:1;background:linear-gradient(180deg,#1e3a5f,#0b0b2a);border-radius:18px;border:1px solid #ffd700;position:relative;overflow:hidden;margin:10px 0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#controls{display:flex;gap:8px}
#controls button{flex:1}
.hint{font-size:12px;text-align:center;color:#ffdf7a;margin:6px 0}
select{background:#111;color:#fff;border:1px solid #ffd700;padding:10px;border-radius:10px;width:100%}
</style>
</head>
<body>
<div id="app">
  <!-- شاشة البداية -->
  <div id="home">
    <h1>👑 Royal Bottle<br>Challenge</h1>
    <div class="sub">التحدي الملكي • 20 مستوى • كل لاعب له تقدمه الخاص</div>
    <div class="card">
      <div style="font-size:13px;margin-bottom:8px">👤 اسم اللاعب <span id="savedTag" style="color:#7dff9a"></span></div>
      <input id="playerName" placeholder="اكتب اسمك هنا...">
      <button class="btn-gold" onclick="startGame()">▶ ابدأ اللعب</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn-dark" style="flex:1" onclick="toggleMusic()">🎵 موسيقى: <span id="musicState">تشغيل</span></button>
        <button class="btn-dark" style="flex:1" onclick="changePlayer()">🔄 لاعب جديد</button>
      </div>
      <div style="text-align:center;font-size:12px;margin-top:10px;color:#ffd700">اختر مستوى — المقفل 🔒 لازم تخلص اللي قبله</div>
      <div class="levels" id="homeLevels"></div>
      <div id="playerInfo" style="text-align:center;font-size:12px;margin-top:10px;color:#ccc"></div>
    </div>
  </div>

  <!-- شاشة اللعبة -->
  <div id="game">
    <div class="top">
      <button class="btn-dark" onclick="goHome()">🏠</button>
      <div><b id="gPlayer">لاعب</b> • <span id="gLevel">المستوى 1</span></div>
      <button class="btn-dark" onclick="toggleMusic()">🎵</button>
    </div>
    <div style="margin-top:10px"><select id="levelSelect" onchange="trySelectLevel(this.value)"></select></div>
    <div class="hint" id="windHint">اسحب القارورة 🍾 وأفلتها في المنطقة الخضراء ✅</div>
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
    <div id="controls">
      <button class="btn-dark" onclick="prevLevel()">◀ السابق</button>
      <button class="btn-gold" onclick="resetLevel()">🔄 إعادة</button>
      <button class="btn-dark" onclick="nextLevel()">التالي ▶</button>
    </div>
  </div>
</div>

<div id="msg"><div id="msgBox"></div></div>

<script>
let players = JSON.parse(localStorage.getItem('royal_bottle_players')||'{}');
let lastPlayer = localStorage.getItem('royal_bottle_last')||'';
let currentPlayer = '';
let unlocked = 1;
let currentLevel = 1;
let selectedLevelBeforeLock = 1;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,bottle, target, dragging=false, vx=0, vy=0, wind=0, started=false, attempts=0;

function saveAll(){
  players[currentPlayer]={unlocked:unlocked, at:Date.now()};
  localStorage.setItem('royal_bottle_players',JSON.stringify(players));
  localStorage.setItem('royal_bottle_last',currentPlayer);
}
function loadPlayer(name){
  currentPlayer=name;
  unlocked = players[name] ? players[name].unlocked : 1;
  if(unlocked>20) unlocked=20;
}
function showMsg(title,txt,btn='حسناً',cb=null){
  const m=document.getElementById('msg'); m.style.display='flex';
  document.getElementById('msgBox').innerHTML=`<h2 style="color:#ffd700;margin:0">${title}</h2><p>${txt}</p><button class="btn-gold" style="width:100%" onclick="closeMsg()">${btn}</button>`;
  window._msgCb=cb;
}
function closeMsg(){document.getElementById('msg').style.display='none'; if(window._msgCb) window._msgCb();}
function renderLevels(){
  const h=document.getElementById('homeLevels'); h.innerHTML='';
  const s=document.getElementById('levelSelect'); s.innerHTML='';
  for(let i=1;i<=20;i++){
    let isLocked = i>unlocked;
    let d=document.createElement('button');
    d.className='lv '+(isLocked?'locked':(i===currentLevel?'current':'open'));
    d.innerHTML=isLocked?`🔒<small>${i}</small>`:`${i}<small>${i===currentLevel?'الآن':i<unlocked?'✓':''}</small>`;
    d.onclick=()=>{ if(isLocked){ playLockSound(); showMsg('🔒 مقفل!','لا تقدر تتخطى! لازم تخلص المستوى '+(i-1)+' أولاً، عشان ينفتح المستوى '+i); } else { currentLevel=i; renderLevels(); startGame(false); } };
    h.appendChild(d);
    let o=document.createElement('option'); o.value=i; o.textContent=isLocked?`🔒 المستوى ${i} - مقفل`:`المستوى ${i} ${i===currentLevel?'(الآن)':''}`; o.selected=(i===currentLevel); s.appendChild(o);
  }
  document.getElementById('playerInfo').textContent = currentPlayer? `👑 ${currentPlayer} — فتحت ${unlocked} من 20 مستوى` : '';
  document.getElementById('gPlayer').textContent=currentPlayer||'لاعب';
  document.getElementById('gLevel').textContent='المستوى '+currentLevel;
}
function trySelectLevel(v){
  let n=parseInt(v);
  if(n>unlocked){ playLockSound(); showMsg('🔒 لا تقدر تتخطى!','لازم تخلص المستوى '+(n-1)+' أولاً، عشان ينفتح المستوى '+n); renderLevels(); return; }
  currentLevel=n; renderLevels(); setupLevel();
}
function startGame(fromHome=true){
  let inp=document.getElementById('playerName');
  let name=(inp.value||'').trim();
  if(fromHome){
    if(!name && lastPlayer){ name=lastPlayer; }
    if(!name){ showMsg('👤 اكتب اسمك','اكتب اسمك أولاً عشان نحفظ تقدمك'); return; }
    loadPlayer(name); inp.value=name;
  } else {
    if(!currentPlayer){ currentPlayer=inp.value.trim()||lastPlayer||'لاعب'; loadPlayer(currentPlayer); }
  }
  saveAll();
  document.getElementById('home').style.display='none';
  document.getElementById('game').style.display='flex';
  renderLevels(); setupLevel(); startMusic();
}
function changePlayer(){ document.getElementById('playerName').value=''; document.getElementById('savedTag').textContent=''; lastPlayer=''; localStorage.removeItem('royal_bottle_last'); document.getElementById('playerName').focus(); }
function goHome(){ document.getElementById('home').style.display='block'; document.getElementById('game').style.display='none'; renderLevels(); }
function prevLevel(){ if(currentLevel>1){ currentLevel--; renderLevels(); setupLevel(); } }
function nextLevel(){ if(currentLevel<unlocked){ currentLevel++; renderLevels(); setupLevel(); } else { showMsg('🔒 مقفل!','خلص المستوى الحالي أولاً عشان ينفتح اللي بعده'); } }
function resetLevel(){ setupLevel(); }

function resize(){ const r=document.getElementById('canvasWrap').getBoundingClientRect(); W=cv.width=r.width*2; H=cv.height=r.height*2; cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; }
window.addEventListener('resize',()=>{ resize(); setupLevel(true); });

function setupLevel(keep=false){
  resize();
  let diff = currentLevel<=5?0 : currentLevel<=10?1 : 2;
  wind = diff===0?0 : diff===1?(Math.random()*0.6-0.3) : (Math.random()*1.4-0.7);
  document.getElementById('windHint').textContent = diff===0? 'اسحب القارورة 🍾 وأفلتها في المنطقة الخضراء ✅' : diff===1? `🌬️ رياح خفيفة! انتبه للرياح • المستوى ${currentLevel}` : `🌪️ رياح قوية جداً! • المستوى ${currentLevel} - ركز`;
  bottle={x:W*0.5,y:H-90,r:28};
  target={x:W*0.5 + (Math.random()*W*0.3-W*0.15), y:90, w:120, h:50};
  vx=0; vy=0; started=true; draw();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // هدف
  ctx.fillStyle='#145a25'; ctx.fillRect(target.x-target.w/2, target.y-target.h/2, target.w, target.h);
  ctx.strokeStyle='#7dff9a'; ctx.lineWidth=4; ctx.strokeRect(target.x-target.w/2, target.y-target.h/2, target.w, target.h);
  ctx.fillStyle='#fff'; ctx.font='bold 28px system-ui'; ctx.textAlign='center'; ctx.fillText('🎯', target.x, target.y+10);
  // رياح
  if(Math.abs(wind)>0.1){ ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='22px system-ui'; ctx.fillText(wind>0?'🌬️ →→→':'←←← 🌬️', W/2, 50); }
  // قارورة
  ctx.save(); ctx.translate(bottle.x,bottle.y);
  ctx.font='64px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🍾',0,0);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='20px system-ui'; ctx.textAlign='left'; ctx.fillText('المستوى '+currentLevel+' / 20',14,28);
}
function pos(e){ const r=cv.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*2, y:(t.clientY-r.top)*2}; }
cv.addEventListener('pointerdown',e=>{ let p=pos(e); if(Math.hypot(p.x-bottle.x,p.y-bottle.y)<90){ dragging=true; } });
cv.addEventListener('pointermove',e=>{ if(!dragging) return; let p=pos(e); bottle.x=p.x; bottle.y=p.y; draw(); });
cv.addEventListener('pointerup',e=>{ if(!dragging) return; dragging=false; let p=pos(e); vx=(p.x-bottle.x)*0.02; vy=-6-Math.random()*2; animate(); });
function animate(){
  if(dragging) return;
  vy+=0.35; vx+=wind*0.08;
  bottle.x+=vx*2; bottle.y+=vy*2;
  if(bottle.y>H-40){ bottle.y=H-40; vy*=-0.4; vx*=0.7; if(Math.abs(vy)<1){ checkWin(); return; } }
  if(bottle.x<20){ bottle.x=20; vx*=-0.5 } if(bottle.x>W-20){ bottle.x=W-20; vx*=-0.5 }
  draw();
  if(bottle.y < target.y+80){ setTimeout(()=>{ if(!dragging) requestAnimationFrame(animate); },16); } else { requestAnimationFrame(animate); }
  // فوز إذا داخل الهدف وسرعة قليلة
  if(Math.abs(bottle.x-target.x)<target.w/2 && Math.abs(bottle.y-target.y)<target.h/2 && Math.abs(vy)<4){
    winLevel(); return;
  }
}
function checkWin(){
  if(Math.abs(bottle.x-target.x)<target.w/2 && bottle.y<200){ winLevel(); } else { showMsg('😅 قريب!','القارورة ما وصلت للمنطقة الخضراء، حاول مرة ثانية','حاول مجدداً',()=>setupLevel()); }
}
function winLevel(){
  if(currentLevel>=unlocked && currentLevel<20){
    unlocked=currentLevel+1;
    saveAll();
    playUnlockSound();
    showMsg('🎉 أحسنت يا بطل!','خلصت المستوى '+currentLevel+'<br>🔓 <b>انكسر قفل المستوى '+unlocked+'!</b> صار مفتوح الآن','العب المستوى التالي',()=>{ currentLevel=unlocked; renderLevels(); setupLevel(); });
  } else if(currentLevel===20){
    playUnlockSound();
    showMsg('👑 أنت الملك!','خلصت كل الـ 20 مستوى! أنت أسطورة Royal Bottle Challenge','العب من جديد',()=>{ currentLevel=1; renderLevels(); setupLevel(); });
  } else {
    showMsg('✅ ممتاز!','خلصت المستوى '+currentLevel,'التالي',()=>{ currentLevel++; renderLevels(); setupLevel(); });
  }
  renderLevels();
}

// ===== موسيقى محسنة - بيانو + باس + إيقاع، تتغير حسب المستوى =====
let audioCtx=null, musicOn=true, musicTimer=null, noteIdx=0;
const scales={
  calm:[261.63,329.63,392.00,440.00,523.25,587.33],
  energy:[261.63,311.13,392.00,466.16,523.25,622.25],
  epic:[196.00,261.63,329.63,392.00,440.00,523.25,659.25]
};
function playTone(freq,dur,type='sine',vol=0.15,when=0){
  if(!audioCtx||!musicOn) return;
  let t=audioCtx.currentTime+when;
  let o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
}
function playLockSound(){ playTone(180,0.15,'square',0.12); setTimeout(()=>playTone(120,0.2,'square',0.12),120); }
function playUnlockSound(){ [523,659,784,1046].forEach((f,i)=>playTone(f,0.35,'triangle',0.18,i*0.12)); }
function startMusic(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  if(musicTimer) return;
  musicTimer=setInterval(()=>{
    if(!musicOn) return;
    let mode = currentLevel<=5?'calm':currentLevel<=10?'energy':'epic';
    let scale=scales[mode];
    let tempo = mode==='calm'?500:mode==='energy'?340:280;
    let n=scale[noteIdx%scale.length];
    playTone(n,0.45,'triangle',0.12);
    if(noteIdx%2===0) playTone(n/2,0.5,'sine',0.10);
    if(noteIdx%4===0) playTone(130,0.15,'sine',0.08);
    noteIdx++;
  }, 420);
}
function toggleMusic(){ musicOn=!musicOn; document.getElementById('musicState').textContent=musicOn?'تشغيل':'إيقاف'; if(musicOn) startMusic(); }

// بداية
if(lastPlayer){ document.getElementById('playerName').value=lastPlayer; document.getElementById('savedTag').textContent='(محفوظ: '+lastPlayer+')'; loadPlayer(lastPlayer); }
else { loadPlayer(''); unlocked=1; }
renderLevels();
</script>
</body>
</html>
